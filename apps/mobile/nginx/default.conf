# Hosting de la versión web (export estático de Expo, `web.output: 'single'`).
# `headers.conf` se genera al compilar desde app.config.ts (scripts/nginx-headers.mjs). Se incluye
# en cada `location` porque un `add_header` dentro de una location anula los del nivel superior.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf;
    gzip_min_length 1024;

    # Archivos con hash en el nombre: inmutables.
    location ~ ^/(_expo|assets)/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta de expo-router se resuelve con index.html, que nunca se cachea para que
    # un despliegue nuevo se vea al recargar.
    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
